<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Componente de Mensajes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #333;
            color: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .card-content {
            display: flex;
            align-items: center;
        }
        .number {
            font-size: 2.5rem;
            font-weight: bold;
            margin-right: 15px;
        }
        .label {
            font-size: 1.25rem;
            opacity: 0.8;
        }
        .icon {
            margin-left: auto;
            width: 40px;
            height: 40px;
            background-color: #555;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .icon svg {
            width: 24px;
            height: 24px;
            fill: #ffb74d;
        }
        .card-footer {
            margin-top: 15px;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            color: #9e9e9e;
        }
        .percent {
            color: #4caf50;
            margin-right: 5px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="card-content">
            <div class="number">20</div>
            <div class="label">Messages</div>
            <div class="icon">
                <!-- placeholder chat icon -->
                <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 00-2 2v14l4-4h14a2 2 0 002-2V4a2 2 0 00-2-2z"/></svg>
            </div>
        </div>
        <div class="card-footer">
            <span class="percent">↑ 4.46%</span>
            <span>Since last month</span>
        </div>
    </div>
</body>
</html>
